name: TEST backend smoke (anonymous, read-only)

# Manual only. Targets the isolated petalpal-backend-test service; the script
# refuses any other host. No secrets, environment, deploy or write permission.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.7.0'
      - name: Anonymous HTTP, CORS and Socket.IO handshake checks
        run: node scripts/test-backend-smoke.mjs
