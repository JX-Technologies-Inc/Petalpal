name: Integration marker vs Prisma migrate (disposable Postgres)

# Verifies the integration database marker against real PostgreSQL and the
# pinned `prisma migrate deploy` (P3005 regression). Disposable service DB only;
# no secrets, environment, provider access or deployment.
on:
  pull_request:
    branches: [main]
    paths:
      - lib/integration-environment.js
      - test/back/integration-marker.postgres.test.js
      - prisma/**
      - prisma.config.ts
      - package-lock.json
      - .github/workflows/integration-marker-postgres.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marker-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Existing migrations require the pgvector extension.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: ci_admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.7.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real Postgres marker and migration scenarios
        env:
          PETALPAL_MARKER_PG_ADMIN_URL: postgresql://ci:ci-disposable@127.0.0.1:5432/ci_admin
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 --test-reporter=tap test/back/integration-marker.postgres.test.js > marker.tap 2>&1
          status=$?
          # Synthetic disposable output only; surface failure lines (URLs removed) as annotations.
          grep -E '^(not )?ok |P3[0-9]{3}|Error|error:|message:|marker' marker.tap | sed -E 's#[a-z]+://[^ ]+#<url>#g' | head -40 | while IFS= read -r line; do echo "::notice title=marker::$line"; done
          exit $status
