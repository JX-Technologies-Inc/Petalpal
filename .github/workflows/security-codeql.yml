name: PetalPal static security

on:
  push:
    branches: [integration/mobile-backend-test]
    paths:
      - '*.js'
      - '*.mjs'
      - '*.ts'
      - 'lib/**'
      - 'data/**'
      - 'scripts/**'
      - 'client/src/**'
      - 'mobile/src/**'
      - 'mobile/*.js'
      - 'cloudflare-worker/src/**'
      - 'package.json'
      - 'client/package.json'
      - 'mobile/package.json'
      - 'mobile/tsconfig.json'
      - '.github/workflows/security-codeql.yml'
      - '.github/codeql/**'
  pull_request:
    branches: [main, integration/mobile-backend-test]
    paths:
      - '*.js'
      - '*.mjs'
      - '*.ts'
      - 'lib/**'
      - 'data/**'
      - 'scripts/**'
      - 'client/src/**'
      - 'mobile/src/**'
      - 'mobile/*.js'
      - 'cloudflare-worker/src/**'
      - 'package.json'
      - 'client/package.json'
      - 'mobile/package.json'
      - 'mobile/tsconfig.json'
      - '.github/workflows/security-codeql.yml'
      - '.github/codeql/**'

permissions: {}

concurrency:
  group: petalpal-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Enable only after switching OFF the existing GitHub default setup.
    # This explicit cutover prevents competing CodeQL configurations.
    if: vars.PETALPAL_CODEQL_ADVANCED == 'true'
    name: CodeQL JS/TS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Required to upload CodeQL results; no application secrets.
    steps:
      - name: Checkout maintained source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.js
            /*.mjs
            /*.ts
            /package.json
            /client/package.json
            /mobile/package.json
            /mobile/tsconfig.json
            /lib/
            /data/
            /scripts/
            /client/src/
            /mobile/src/
            /mobile/*.js
            /cloudflare-worker/src/
            /.github/codeql/
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
